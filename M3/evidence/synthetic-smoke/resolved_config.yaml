agent:
  planner:
    _target_: made.agents.m3_planning.M3ResearchPlanner
    max_stoichiometry: 4
    num_compositions: 1
    num_candidates: 4
    seed: ${experiment.seed}
    selection_strategy: diversity
    batch_size: 4
    coverage_weight: 0.5
    near_hull_threshold: 0.1
    max_attempts_per_composition: 2
    memory_failure_limit: 2
    max_trace: 20
    selection_strategy_kwargs:
      distance_metric: euclidean
      unattempted_weight: 5.0
      attempt_weight_factor: 0.7
      failure_weight_factor: 0.3
      mask_same_reduced_formula: true
  generator:
    _target_: made.agents.generators.RandomGenerator
    lattice_length_range:
    - 3.0
    - 15.0
    lattice_angle_range:
    - 60.0
    - 120.0
    seed: ${experiment.seed}
  filter:
    _target_: made.agents.filters.SMACTValidityFilter
  scorer:
    _target_: made.agents.scorers.RandomSelector
    seed: ${experiment.seed}
  self_correction_policy:
    _target_: made.agents.m3_planning.M3StuckReplanPolicy
    window: 6
    max_repeat: 2
    cooldown: 3
    max_stoichiometry: ${agent.planner.max_stoichiometry}
    max_candidates: 32
    seed: ${experiment.seed}
    max_history: 64
    max_events: 50
  _target_: made.agents.m1_integrated.M1IntegratedAgent
  enable_planning: true
  enable_memory: true
  enable_reflection: true
  enable_exploration: false
  enable_tool_routing: false
  query_budget: ${environment.budget}
  memory_size: 20
  generators: {}
  memory_manager: null
  exploration_policy: null
  tool_router: null
dataset:
  _target_: smoke_dataset.SmokeDataset
  elements:
  - Li
  - O
  thermo_types:
  - GGA_GGA+U
environment:
  _target_: made.envs.ConvexHullEnvironment
  budget: 12
  start_with_all_stable: false
  compute_elemental_from_oracle: true
  stability_tolerance: 0.1
  include_near_stable_from_ground_truth: true
  filter_by_smact: true
  max_stoichiometry: 4
  structure_matcher_ltol: 0.2
  structure_matcher_stol: 0.3
  structure_matcher_angle_tol: 5
  structure_matcher_primitive_cell: true
logger:
  use_wandb: false
  wandb_project: made-benchmark
  wandb_entity: your-wandb-username
  wandb_run_name: null
  wandb_tags:
  - benchmark
oracle:
  _target_: made.oracles.AnalyticOracle
  model_name: lj
  element_reference_energies_path: null
  relax: false
  relax_kwargs:
    optimizer: fire
    fmax: 0.02
    steps: 500
    relax_unit_cell: true
  num_workers: 1
experiment:
  output_dir: ${hydra:run.dir}
  num_episodes: 1
  seed: 17
  infra: local
  verbose: true
  logging_level: INFO
  systems: []
  systems_file: null
  max_systems: 5

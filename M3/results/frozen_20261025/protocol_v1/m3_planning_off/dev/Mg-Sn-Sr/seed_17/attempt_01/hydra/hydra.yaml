hydra:
  run:
    dir: ${hydra:runtime.cwd}/results/${now:%Y%m%d-%H%M%S}-${hydra:runtime.choices.oracle}-${hydra:runtime.choices.agent}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - agent=m1_integrated
    - dataset.elements=[Mg,Sn,Sr]
    - dataset.thermo_types=[GGA_GGA+U]
    - oracle=orb
    - oracle.model_name=orb-v3-conservative-inf-omat
    - oracle.device=cpu
    - oracle.relax=true
    - oracle.relax_kwargs.optimizer=fire
    - oracle.relax_kwargs.fmax=0.02
    - oracle.relax_kwargs.steps=500
    - oracle.relax_kwargs.relax_unit_cell=true
    - environment.budget=20
    - environment.max_stoichiometry=20
    - environment.stability_tolerance=0.1
    - environment.filter_by_smact=true
    - environment.include_near_stable_from_ground_truth=true
    - experiment.num_episodes=1
    - experiment.seed=17
    - experiment.verbose=false
    - logger.use_wandb=false
    - experiment.output_dir=results/protocol_v1/m3_planning_off/dev/Mg-Sn-Sr/seed_17/attempt_01
    - agent.enable_planning=false
    - agent.enable_memory=true
    - agent.enable_reflection=true
    - agent.enable_exploration=false
    - agent.enable_tool_routing=false
    - agent/planner=m3_research
    - agent.generator.seed=${experiment.seed}
    - agent.planner.seed=${experiment.seed}
    - agent.scorer.seed=${experiment.seed}
  job:
    name: run_benchmark
    chdir: null
    override_dirname: agent.enable_exploration=false,agent.enable_memory=true,agent.enable_planning=false,agent.enable_reflection=true,agent.enable_tool_routing=false,agent.generator.seed=${experiment.seed},agent.planner.seed=${experiment.seed},agent.scorer.seed=${experiment.seed},agent/planner=m3_research,agent=m1_integrated,dataset.elements=[Mg,Sn,Sr],dataset.thermo_types=[GGA_GGA+U],environment.budget=20,environment.filter_by_smact=true,environment.include_near_stable_from_ground_truth=true,environment.max_stoichiometry=20,environment.stability_tolerance=0.1,experiment.num_episodes=1,experiment.output_dir=results/protocol_v1/m3_planning_off/dev/Mg-Sn-Sr/seed_17/attempt_01,experiment.seed=17,experiment.verbose=false,logger.use_wandb=false,oracle.device=cpu,oracle.model_name=orb-v3-conservative-inf-omat,oracle.relax=true,oracle.relax_kwargs.fmax=0.02,oracle.relax_kwargs.optimizer=fire,oracle.relax_kwargs.relax_unit_cell=true,oracle.relax_kwargs.steps=500,oracle=orb
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: C:\Users\User\PE6203\Group-Project-6-Auto-Research-for-Materials-Discovery\M1\MADE
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: C:\Users\User\PE6203\Group-Project-6-Auto-Research-for-Materials-Discovery\M1\MADE\configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: C:\Users\User\PE6203\Group-Project-6-Auto-Research-for-Materials-Discovery\M1\MADE\results\20261025-221142-orb-m1_integrated
    choices:
      oracle: orb
      logger: wandb
      environment: convex_hull
      dataset: phase_diagram
      agent: m1_integrated
      agent/self_correction_policy: m3_stuck_replan
      agent/scorer: random
      agent/filter: smact
      agent/generator: random
      agent/planner: m3_research
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false

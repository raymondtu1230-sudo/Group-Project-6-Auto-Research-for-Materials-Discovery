_target_: m4_memory.capture.CapturedM1IntegratedAgent

capture_path: ${hydra:runtime.output_dir}/m4_proposal_events.jsonl
capture_run_id: ${oc.env:M4_RUN_ID,m4-local}
capture_episode_id: ${oc.env:M4_EPISODE_ID,0}

defaults:
  - planner: diversity
  - generator: random
  - filter: smact
  - scorer: random
  - self_correction_policy: m3_stuck_replan

enable_planning: true
enable_memory: true
enable_reflection: false
enable_exploration: false
enable_tool_routing: false
query_budget: ${environment.budget}
memory_size: 20
# M4 package: install editable from ../../M4 before running this config.
# Use a fresh manager and unique run ID for each experiment attempt.
memory_manager:
  _target_: m4_memory.m1_adapter.M4MemoryManager
  log_path: ${hydra:runtime.output_dir}/m4_evidence.jsonl
  run_id: ${oc.env:M4_RUN_ID,m4-local}
  episode_id: ${oc.env:M4_EPISODE_ID,0}
  limit: 8
  max_chars: 4000
# M3 policy is configured but remains inactive unless enable_reflection is on.
# M5 UCB exploration policy, wired and ready; flip enable_exploration for the
# ablation pair. Switch defaults off so the M1 reference is unchanged.
exploration_policy:
  _target_: made.agents.m5_exploration.UCBExplorationPolicy
  seed: ${experiment.seed}
  alpha0: 0.8
  gamma: 1.0
  beta0: 2.0
  max_stoichiometry: 8
  length_scale: 0.35
  noise: 0.0001
  max_pool: 512
  log_path: ${hydra:runtime.output_dir}/m5_decisions.jsonl
# M2 outcome-aware tool router. Requires `generators` below when routing is on.
tool_router:
  _target_: made.agents.m2_tool_routing.OutcomeAwareToolRouter
  seed: ${experiment.seed}
  generator_names: [default, chemeleon]
  exploration_weight: 0.5
  stable_reward: 0.25
  late_budget_threshold: 2

generators:
  chemeleon:
    _target_: made.agents.generators.chemeleon.ChemeleonGenerator
    seed: ${experiment.seed}
    task: csp
    batch_size: 32
    device: cpu

planner:
  seed: ${experiment.seed}
  num_compositions: 1
  num_candidates: 8
  selection_strategy_kwargs:
    distance_metric: euclidean
    unattempted_weight: 5.0
    attempt_weight_factor: 0.7
    failure_weight_factor: 0.3
    mask_same_reduced_formula: true

generator:
  seed: ${experiment.seed}

scorer:
  seed: ${experiment.seed}

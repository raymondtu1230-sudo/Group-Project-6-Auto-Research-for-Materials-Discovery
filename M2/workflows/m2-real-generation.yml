name: M2 actual Chemeleon checkpoint verification

on:
  push:
    branches: [m2/tool-routing-evaluation]
    paths:
      - .github/workflows/m2-real-generation.yml
      - M2/verify_generation.py
      - M2/verify_materials_project.py
      - M2/integration/m2_tool_routing.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-api-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: M1/MADE/uv.lock
      - name: Install the frozen MADE environment
        working-directory: M1/MADE
        run: uv sync --locked
      - name: Make one actual authenticated Materials Project request
        working-directory: M1/MADE
        env:
          MATERIALS_PROJECT_API_KEY: ${{ secrets.TUWEIKANG_MATERIALS_PROJECT_API_KEY }}
        run: uv run python ../../M2/verify_materials_project.py --output ../../M2/results/api-access/verification.json
      - name: Preserve API verification without the credential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-actual-api-verification
          path: M2/results/api-access/verification.json
          if-no-files-found: warn
          retention-days: 30
  actual-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      UV_LINK_MODE: hardlink
    defaults:
      run:
        working-directory: M1/MADE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: M1/MADE/uv.lock
      - name: Install the frozen MADE environment
        run: uv sync --locked
      - name: Verify actual diffusion generation and checkpoint continuation
        run: uv run python ../../M2/verify_generation.py --seed 17 --output ../../M2/results/real-generation-check
      - name: Preserve actual generated structures and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-real-generation-verification
          path: M2/results/real-generation-check/
          if-no-files-found: warn
          retention-days: 30
